services:
  bulleyebot:
    container_name: BullEyeBot
    build:
      context: ${BULLEYEBOT_SOURCE_PATH:-.}
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DATABASE_PATH=${DATABASE_PATH}
      - PREFIX=${PREFIX}
      - TIMEZONE=${TIMEZONE}
    volumes:
      - bot_data:/data
    restart: unless-stopped

volumes:
  bot_data:
