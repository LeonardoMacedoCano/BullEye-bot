services:
  bulleyebot:
    container_name: BullEyeBot
    build:
      context: ${BULLEYEBOT_SOURCE_PATH:-.}
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DATABASE_PATH=${DATABASE_PATH:-/data/bot.db}
      - TIMEZONE=${TIMEZONE:-UTC}
      - ENABLE_RESETDB=${ENABLE_RESETDB:-}
      - PRICE_CACHE_TTL_MINUTES=${PRICE_CACHE_TTL_MINUTES:-5}
      - DIV_CACHE_TTL_HOURS=${DIV_CACHE_TTL_HOURS:-24}
      - FEAR_GREED_CACHE_TTL_MINUTES=${FEAR_GREED_CACHE_TTL_MINUTES:-30}
    volumes:
      - bot_data:/data
    restart: unless-stopped

volumes:
  bot_data:
